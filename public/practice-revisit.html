<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VettaLume · Revisit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8e9e6; --ink-2:#e3e5e1;
  --panel:#f0f1ee; --panel-2:#e9ebe7; --panel-3:#dcded9;
  --line:rgba(22,26,22,.14); --line-soft:rgba(22,26,22,.085);
  --text:#181a18; --text-2:#43473f; --text-3:#74786e; --text-4:#9a9d93;
  --brand:#c8932e; --gold-ink:#8a5d16;
  --ok:#5c8f72; --warn:#bb7d49; --err:#b2635a;
  --maxw:900px;
  --f-display:"Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --course:#c8932e;
}
body[data-exam="CAT"]{--course:#c8932e}
body[data-exam="GMAT"]{--course:#a8705f}
body[data-exam="GRE"]{--course:#6a6f9c}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5;
  min-height:100vh;position:relative;overflow-x:hidden;background:linear-gradient(168deg,var(--ink),var(--ink-2))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 50% -10%, color-mix(in srgb,var(--course) 12%,transparent), transparent 62%)}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 28px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.subbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px}
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;color:var(--text-3);padding:6px 0;transition:color .16s}
.back:hover{color:var(--course)}
.rhero{padding:20px 0 6px}
.rhero .ck{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}
.rhero h1{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;font-size:38px;line-height:1.04}
.rhero .rsum{font-size:14.5px;color:var(--text-3);margin-top:10px}

.rlist{display:flex;flex-direction:column;gap:16px;margin:24px 0 40px}
.rcard{border:1px solid var(--line-soft);border-radius:13px;background:color-mix(in srgb,var(--brand) 4%,var(--panel-2));padding:20px 22px}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rn{font-family:var(--f-display);font-weight:800;font-size:16px;margin-right:auto}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;border:1px solid var(--line-soft);background:var(--panel);color:var(--text-3)}
.tag.diff{color:var(--gold-ink);border-color:color-mix(in srgb,var(--course) 30%,var(--line-soft))}
.badge{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:6px}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
.badge.no{color:var(--err);background:color-mix(in srgb,var(--err) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--err) 42%,var(--line))}
.rstem{font-size:15.5px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:14px}
.ropts{display:flex;flex-direction:column;gap:9px}
.ropt{display:flex;align-items:center;gap:13px;padding:11px 15px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.ropt .ol{width:24px;height:24px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--text-3)}
.ropt .otx{font-size:14.5px;color:var(--text-2)}
.ropt .oflag{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ropt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.ropt.correct .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.ropt.correct .oflag{color:var(--ok)}
.ropt.wrong{border-color:var(--err);background:color-mix(in srgb,var(--err) 9%,var(--panel))}
.ropt.wrong .ol{background:var(--err);color:#fff;border-color:var(--err)}
.ropt.wrong .oflag{color:var(--err)}
.tita-ans{display:flex;flex-direction:column;gap:7px}
.tita-ans .ta{display:flex;gap:10px;font-size:14.5px}
.tita-ans .tk{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--text-4);min-width:110px;text-transform:uppercase;padding-top:2px}
.tita-ans .tv{font-weight:600;color:var(--text)}
.tita-ans .tv.ok{color:var(--ok)} .tita-ans .tv.no{color:var(--err)}
.solution{margin-top:14px;border:1px solid var(--line-soft);border-left:3px solid var(--course);border-radius:8px;background:color-mix(in srgb,var(--course) 5%,var(--panel-2));padding:13px 15px;font-size:14px;color:var(--text-2);line-height:1.6}
.solution .sk{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-4);margin-bottom:6px}
.empty{border:1px solid var(--line-soft);border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,var(--panel-2));padding:44px 30px;text-align:center;color:var(--text-3);font-size:15px;margin:24px 0}
.empty b{color:var(--text);display:block;font-size:18px;margin-bottom:8px}
@media(max-width:640px){.rhero h1{font-size:30px}}
</style>
</head>
<body data-exam="CAT">
<div class="wrap">
  <div class="subbar"><button class="back" id="back">&larr; Back</button></div>
  <section class="rhero">
    <div class="ck" id="crumb">Revisit</div>
    <h1 id="title">Revisit questions</h1>
    <p class="rsum" id="summary">Loading your solved questions…</p>
  </section>
  <div class="rlist" id="rlist"></div>
</div>
<script>
var LETTERS=["A","B","C","D","E"];
var qp=new URLSearchParams(location.search);
var exam=(qp.get('exam')||'cat').toLowerCase(), EX=exam.toUpperCase();
var section=qp.get('section')||'', chapter=qp.get('chapter')||'', chapterName=qp.get('chapterName')||'';
var api=qp.get('api')||'http://localhost:8001';
var token=null; try{token=localStorage.getItem('vetta:token');}catch(e){}
var H=token?{Authorization:'Bearer '+token}:{};
var backHref='/learn/'+exam+'/'+section+'/'+chapter;
document.body.setAttribute('data-exam',EX);

function slug(s){return (s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function postH(){try{parent.postMessage({type:'mockFrameHeight',height:document.documentElement.scrollHeight},'*');}catch(e){}}
function resolveCorrect(ca,opts){ca=(ca||'').trim();var i="ABCDE".indexOf(ca.toUpperCase());if(ca.length===1&&i>=0&&opts&&opts[i]!=null)return opts[i];return ca;}
function isTita(a){return (a.format||'').toLowerCase()==='tita' || !(a.options&&a.options.length);}
function diffLabel(d){var b=Math.max(1,Math.min(5,(d||0)+3));return 'D'+b;}

document.getElementById('back').addEventListener('click',function(){top.location.href=backHref;});
if(chapterName){document.getElementById('crumb').textContent=chapterName+' · Revisit';document.getElementById('title').textContent=chapterName;}

function renderCard(a,i){
  var badge=a.correct?'<span class="badge ok">Correct</span>':'<span class="badge no">Incorrect</span>';
  var conceptTag=a.concept?('<span class="tag">'+esc(a.concept)+'</span>'):'';
  var body='';
  if(isTita(a)){
    var cv=a.correct_answer;
    body='<div class="tita-ans">'+
      '<div class="ta"><span class="tk">Your answer</span><span class="tv '+(a.correct?'ok':'no')+'">'+esc(a.your_answer||'—')+'</span></div>'+
      '<div class="ta"><span class="tk">Correct answer</span><span class="tv ok">'+esc(cv)+'</span></div></div>';
  }else{
    var correctVal=resolveCorrect(a.correct_answer,a.options||[]);
    body='<div class="ropts">'+(a.options||[]).map(function(o,k){
      var cls='',flag='';
      if(o===correctVal){cls=' correct';flag='Correct answer';}
      if(o===a.your_answer && o!==correctVal){cls=' wrong';flag='Your answer';}
      else if(o===a.your_answer && o===correctVal){flag='Your answer';}
      return '<div class="ropt'+cls+'"><div class="ol">'+(LETTERS[k]||(k+1))+'</div><div class="otx">'+esc(o)+'</div>'+(flag?'<span class="oflag">'+flag+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }
  var sol=a.solution?('<div class="solution"><div class="sk">Solution</div><div>'+a.solution+'</div></div>'):'';
  var att=(a.attempts&&a.attempts>1)?('<span class="tag">'+a.attempts+' attempts</span>'):'';
  return '<div class="rcard"><div class="rtop"><span class="rn">Q'+(i+1)+'</span>'+conceptTag+'<span class="tag diff">'+diffLabel(a.difficulty)+'</span>'+att+badge+'</div>'+
    '<div class="rstem">'+esc(a.stem)+'</div>'+body+sol+'</div>';
}

fetch(api+'/learn/overview?exam='+exam,{headers:H}).then(function(r){return r.json();}).then(function(ov){
  var sec=(ov.sections||[]).find(function(s){return s.key.toLowerCase()===section.toLowerCase();});
  var ch=sec&&(sec.chapters||[]).find(function(c){return slug(c.name)===chapter;});
  var q=ch?('&topic_id='+encodeURIComponent(ch.id)):('&topic='+encodeURIComponent(chapterName));
  return fetch(api+'/analysis/chapter/attempts?exam='+encodeURIComponent(EX)+q,{headers:H}).then(function(r){return r.json();});
}).then(function(d){
  var atts=(d&&d.attempts)||[];
  if(d&&d.chapter&&d.chapter.name){document.getElementById('title').textContent=d.chapter.name;document.getElementById('crumb').textContent=d.chapter.name+' · Revisit';}
  if(!atts.length){
    document.getElementById('summary').textContent='';
    document.getElementById('rlist').innerHTML='<div class="empty"><b>Nothing to revisit yet</b>Solve some questions in this chapter’s quizzes or practice, and they’ll appear here for review.</div>';
    postH(); return;
  }
  var ok=atts.filter(function(a){return a.correct;}).length;
  document.getElementById('summary').textContent=atts.length+' questions solved · '+ok+' correct · '+(atts.length-ok)+' to review';
  document.getElementById('rlist').innerHTML=atts.map(renderCard).join('');
  postH();
}).catch(function(){
  document.getElementById('summary').textContent='Could not load your solved questions.';
  postH();
});
window.addEventListener('load',function(){postH();setTimeout(postH,400);});
window.addEventListener('resize',postH);
try{new ResizeObserver(postH).observe(document.body);}catch(e){}
</script>
</body>
</html>
