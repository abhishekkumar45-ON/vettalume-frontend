<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VettaLume · Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8e9e6; --ink-2:#e3e5e1;
  --panel:#f0f1ee; --panel-2:#e9ebe7; --panel-3:#dcded9;
  --line:rgba(22,26,22,.14); --line-soft:rgba(22,26,22,.085);
  --text:#181a18; --text-2:#43473f; --text-3:#74786e; --text-4:#9a9d93;
  --brand:#c8932e; --gold-ink:#8a5d16;
  --ok:#5c8f72; --warn:#bb7d49; --err:#b2635a;
  --maxw:760px;
  --f-display:"Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --course:#c8932e;
}
body[data-exam="CAT"]{--course:#c8932e}
body[data-exam="GMAT"]{--course:#a8705f}
body[data-exam="GRE"]{--course:#6a6f9c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5;
  min-height:100vh;position:relative;overflow-x:hidden;background:linear-gradient(168deg,var(--ink),var(--ink-2))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 50% -10%, color-mix(in srgb,var(--course) 12%,transparent), transparent 62%)}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 28px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.testbar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 94%,transparent),color-mix(in srgb,var(--ink) 66%,transparent));
  backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid color-mix(in srgb,var(--course) 30%,var(--line))}
.testbar .wrap{display:flex;align-items:center;gap:16px;width:100%;max-width:var(--maxw)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:19px}
.tmock{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-left:1px solid var(--line);padding-left:16px}
.tmock b{color:var(--course)}
.tprog{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--gold-ink);background:color-mix(in srgb,var(--course) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--course) 26%,var(--line-soft));border-radius:8px;padding:7px 12px}
.hsubmit{font-family:var(--f-body);font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:8px;color:#fff;background:color-mix(in srgb,var(--gold-ink) 78%,var(--brand));border:1px solid color-mix(in srgb,var(--gold-ink) 52%,#000);transition:transform .16s}
.hsubmit:hover{transform:translateY(-1px)}

.bar{height:4px;background:color-mix(in srgb,var(--course) 12%,var(--panel-2));border-radius:99px;overflow:hidden;margin:22px 0 6px}
.bar i{display:block;height:100%;background:var(--course);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.adaptnote{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-4);margin-bottom:14px}

.qcard{border:1px solid var(--line-soft);border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,var(--panel-2));padding:26px 30px 24px;min-height:340px;display:flex;flex-direction:column;margin-bottom:30px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:15px;border-bottom:1px solid var(--line-soft);margin-bottom:20px}
.qtop .qn{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4)}
.diff-tag{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.03em;padding:5px 11px;border-radius:7px;border:1px solid var(--line-soft);background:var(--panel)}
.diff-d1,.diff-d2{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.diff-d3{color:var(--gold-ink);border-color:color-mix(in srgb,var(--course) 42%,var(--line));background:color-mix(in srgb,var(--course) 9%,var(--panel))}
.diff-d4,.diff-d5{color:var(--err);border-color:color-mix(in srgb,var(--err) 42%,var(--line));background:color-mix(in srgb,var(--err) 9%,var(--panel))}
.qstem{font-size:18px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:auto}
.opt{display:flex;align-items:center;gap:15px;padding:15px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;transition:border-color .16s,transform .14s,background .16s}
.opt:hover{border-color:color-mix(in srgb,var(--course) 42%,var(--line));transform:translateX(2px)}
.opt .ol{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--text-3);transition:all .16s}
.opt .otx{font-size:15.5px;color:var(--text-2)}
.opt.sel{border-color:var(--course);background:color-mix(in srgb,var(--course) 7%,var(--panel))}
.opt.sel .ol{background:var(--course);color:#fff;border-color:var(--course)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.correct .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--err);background:color-mix(in srgb,var(--err) 10%,var(--panel))}
.opt.wrong .ol{background:var(--err);color:#fff;border-color:var(--err)}
.opts.locked .opt{cursor:default}.opts.locked .opt:hover{transform:none}
.tita{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.tita input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;font-family:var(--f-mono);font-size:16px;color:var(--text)}
.tita input:focus{outline:none;border-color:color-mix(in srgb,var(--course) 50%,var(--line))}
.tita .thint{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--text-4)}
.feedback{margin-top:20px;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;display:none;align-items:center;gap:10px}
.feedback.ok{display:flex;background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line));color:var(--ok)}
.feedback.no{display:flex;background:color-mix(in srgb,var(--err) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--err) 42%,var(--line));color:var(--err)}
.solution{margin-top:12px;border:1px solid var(--line-soft);border-left:3px solid var(--course);border-radius:8px;background:color-mix(in srgb,var(--course) 5%,var(--panel-2));padding:14px 16px;font-size:14.5px;color:var(--text-2);line-height:1.6;display:none}
.solution.show{display:block}
.solution .sk{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-4);margin-bottom:7px}
.qactions{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-soft)}
.btn{font-family:var(--f-body);font-size:13.5px;font-weight:600;padding:12px 22px;border-radius:9px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:9px;transition:border-color .16s,background .16s,transform .14s;margin-left:auto}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--course);color:#fff;border-color:color-mix(in srgb,var(--course) 70%,#000)}
.btn-primary:hover{box-shadow:0 8px 24px color-mix(in srgb,var(--course) 32%,transparent)}
.btn.is-off{opacity:.4;cursor:not-allowed;pointer-events:none}
.state{border:1px solid var(--line-soft);border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,var(--panel-2));padding:44px 30px;text-align:center;color:var(--text-3);font-size:15px;margin:24px 0}
.state b{color:var(--text);display:block;font-size:20px;margin-bottom:8px}
.state .sc{font-family:var(--f-mono);color:var(--gold-ink);font-weight:600;margin-top:12px}
.state .btn{margin:20px auto 0}
.spin{display:inline-block;width:18px;height:18px;border:2px solid color-mix(in srgb,var(--course) 30%,var(--line));border-top-color:var(--course);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-exam="CAT">
<div class="testbar">
  <div class="wrap">
    <div class="logo">▲ <span>VettaLume</span></div>
    <div class="tmock">Practice &middot; <b id="chLabel">Chapter</b></div>
    <div class="tprog" id="prog">0 / 0</div>
    <button class="hsubmit" id="finishBtn">Finish</button>
  </div>
</div>

<div class="wrap">
  <div class="bar"><i id="barFill"></i></div>
  <div class="adaptnote">Adaptive practice — questions mix across the chapter's subtopics; each starts easy and gets harder as you get that subtopic right</div>
  <div id="host"></div>
</div>

<script>
var LETTERS=["A","B","C","D","E","F"];
var qp=new URLSearchParams(location.search);
var exam=(qp.get('exam')||'cat').toLowerCase(), EX=exam.toUpperCase();
var section=qp.get('section')||'', chapter=qp.get('chapter')||'', chapterName=qp.get('chapterName')||'';
var api=qp.get('api')||'http://localhost:8001';
var token=null; try{token=localStorage.getItem('vetta:token');}catch(e){}
var H=token?{Authorization:'Bearer '+token}:{};
var backHref='/learn/'+exam+'/'+section+'/'+chapter;
document.body.setAttribute('data-exam',EX);

var TOPIC_ID=null, cur=null, curSub=null, chosen=null, typed='', checked=false, seen=[], correctCount=0, total=0, answered=0;
var prefetchP=null, prefetchData=null;

function slug(s){return (s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function postH(){try{parent.postMessage({type:'mockFrameHeight',height:document.documentElement.scrollHeight},'*');}catch(e){}}
function resolveCorrect(ca,opts){ca=(ca||'').trim();var i="ABCDE".indexOf(ca.toUpperCase());if(ca.length===1&&i>=0&&opts&&opts[i]!=null)return opts[i];return ca;}
function normA(s){return (s||'').trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'');}
function titaOk(t,c){var a=normA(t),b=normA(c);if(a&&a===b)return true;var na=parseFloat(a),nb=parseFloat(b);return isFinite(na)&&isFinite(nb)&&na===nb;}
function isTita(q){return (q.format||'').toLowerCase()==='tita' || !(q.options&&q.options.length);}
function setProg(){document.getElementById('prog').textContent=answered+' / '+total+' subtopics';document.getElementById('barFill').style.width=(total?Math.round(100*answered/total):0)+'%';}
function diffTag(d){var b=Math.max(1,Math.min(5,(d||0)+3));var L={1:'Very easy',2:'Easy',3:'Medium',4:'Hard',5:'Very hard'};return {band:b,text:'Level D'+b+' · '+(L[b]||'Medium')};}

document.getElementById('finishBtn').addEventListener('click',function(){top.location.href=backHref;});
if(chapterName) document.getElementById('chLabel').textContent=chapterName;

function fetchNext(excludeArr){
  var ex=excludeArr.length?('&exclude='+encodeURIComponent(excludeArr.join(','))):'';
  return fetch(api+'/practice/adaptive?exam='+encodeURIComponent(EX)+'&topic_id='+encodeURIComponent(TOPIC_ID)+ex,{headers:H})
    .then(function(r){return r.json();}).catch(function(){return {status:'error',message:'Could not load the next question.'};});
}
function applyNext(d){
  total=d.subtopics_total||total; if(d.subtopics_mastered!=null) answered=d.subtopics_mastered; setProg();
  if(d.chapter&&d.chapter.name) document.getElementById('chLabel').textContent=d.chapter.name;
  if(!d.status || d.status!=='ok'){ renderEnd(d); return; }
  cur=d.question; curSub=d.subtopic||null; chosen=null; typed=''; checked=false; renderQ();
}

function renderQ(){
  var q=cur, host=document.getElementById('host'), dt=diffTag(q.difficulty);
  var subnm=curSub?esc(curSub.name):'Practice';
  var html='<div class="qcard"><div class="qtop"><span class="qn">Subtopic · '+subnm+'</span><span class="diff-tag diff-d'+dt.band+'">'+dt.text+'</span></div>';
  html+='<div class="qstem">'+esc(q.stem)+'</div>';
  if(isTita(q)){
    html+='<div class="tita"><input id="titaInput" type="text" placeholder="Type your answer" value="'+esc(typed)+'"><span class="thint">Numerical answer — press Check when ready.</span></div>';
  }else{
    html+='<div class="opts" id="opts">';
    (q.options||[]).forEach(function(o,i){ html+='<div class="opt" data-val="'+esc(o)+'"><div class="ol">'+(LETTERS[i]||(i+1))+'</div><div class="otx">'+esc(o)+'</div></div>'; });
    html+='</div>';
  }
  html+='<div class="feedback" id="feedback"></div><div class="solution" id="solution"><div class="sk">Solution</div><div id="solText"></div></div>';
  html+='<div class="qactions"><button class="btn btn-primary" id="actBtn">Check answer</button></div></div>';
  host.innerHTML=html;
  if(isTita(q)){ var inp=document.getElementById('titaInput'); inp.addEventListener('input',function(){typed=inp.value;}); }
  else { host.querySelectorAll('#opts .opt').forEach(function(el){ el.addEventListener('click',function(){ if(checked)return; chosen=el.getAttribute('data-val'); host.querySelectorAll('#opts .opt').forEach(function(x){x.classList.remove('sel');}); el.classList.add('sel'); }); }); }
  document.getElementById('actBtn').addEventListener('click',onAct);
  postH();
}

function onAct(){ if(!checked){ check(); } else { goNext(); } }

function goNext(){
  seen.push(cur.item_id);
  if(prefetchData){ var d=prefetchData; prefetchData=null; prefetchP=null; applyNext(d); return; }
  document.getElementById('host').innerHTML='<div class="state"><b><span class="spin"></span>Loading…</b>Picking your next question.</div>'; postH();
  var p = prefetchP || fetchNext(seen); prefetchP=null;
  p.then(applyNext);
}

function check(){
  var q=cur, given=isTita(q)?(typed.trim()):chosen;
  if(!given) return;
  var btn=document.getElementById('actBtn'); btn.classList.add('is-off');
  fetch(api+'/learn/answer',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({item_id:q.item_id,answer_given:given})})
    .then(function(r){return r.json();}).then(function(res){
      checked=true; btn.classList.remove('is-off');
      var cv=resolveCorrect(res.correct_answer,q.options||[]);
      var ok=isTita(q)?titaOk(given,res.correct_answer):(given===cv);
      if(ok) correctCount++;
      var opts=document.getElementById('opts');
      if(opts){ opts.classList.add('locked'); opts.querySelectorAll('.opt').forEach(function(el){ var v=el.getAttribute('data-val'); if(v===cv)el.classList.add('correct'); else if(v===given)el.classList.add('wrong'); }); }
      var inp=document.getElementById('titaInput'); if(inp) inp.disabled=true;
      var fb=document.getElementById('feedback'); fb.className='feedback '+(ok?'ok':'no'); fb.textContent=ok?'Correct':'Not quite — the correct answer is highlighted.';
      var sol=document.getElementById('solution'); if(res.solution){ document.getElementById('solText').innerHTML=res.solution; sol.classList.add('show'); }
      btn.innerHTML='Next question <span>&rarr;</span>';
      // Prefetch the next question NOW (edge already updated by /learn/answer) so "Next" is instant.
      prefetchData=null;
      prefetchP = fetchNext(seen.concat([q.item_id]));
      prefetchP.then(function(d){ prefetchData=d; });
      postH();
    }).catch(function(){ btn.classList.remove('is-off'); });
}

function renderEnd(d){
  var host=document.getElementById('host');
  var msg = d.status==='empty' ? 'No practice questions yet' : (d.status==='done' ? 'Chapter practice complete' : 'Something went wrong');
  var body = d.status==='empty'
    ? 'Once an admin adds practice questions to this chapter’s subtopics, they’ll appear here.'
    : (d.status==='done' ? 'You’ve mastered the practice for every subtopic in this chapter.' : (d.message||''));
  var score = (correctCount>0) ? ('<div class="sc">'+correctCount+' correct this session.</div>') : '';
  host.innerHTML='<div class="state"><b>'+msg+'</b>'+body+score+'<button class="btn btn-primary" id="backBtn">Back to chapter <span>&rarr;</span></button></div>';
  document.getElementById('backBtn').addEventListener('click',function(){top.location.href=backHref;});
  postH();
}

window.addEventListener('load',function(){postH();setTimeout(postH,400);});
window.addEventListener('resize',postH);
try{new ResizeObserver(postH).observe(document.body);}catch(e){}

// resolve the chapter's backend node id, then start the adaptive practice
fetch(api+'/learn/overview?exam='+exam,{headers:H}).then(function(r){return r.json();}).then(function(ov){
  var sec=(ov.sections||[]).find(function(s){return s.key.toLowerCase()===section.toLowerCase();});
  var ch=sec&&(sec.chapters||[]).find(function(c){return slug(c.name)===chapter;});
  TOPIC_ID = ch ? ch.id : null;
  if(!TOPIC_ID){ renderEnd({status:'error',message:'Could not find this chapter.'}); return; }
  fetchNext([]).then(applyNext);
}).catch(function(){ renderEnd({status:'error',message:'Could not load practice.'}); });
</script>
</body>
</html>
