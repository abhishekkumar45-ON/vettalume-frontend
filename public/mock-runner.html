<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VettaLume · Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8e9e6; --ink-2:#e3e5e1;
  --panel:#f0f1ee; --panel-2:#e9ebe7; --panel-3:#dcded9;
  --line:rgba(22,26,22,.14); --line-soft:rgba(22,26,22,.085);
  --text:#181a18; --text-2:#43473f; --text-3:#74786e; --text-4:#9a9d93;
  --brand:#c8932e; --gold-ink:#8a5d16;
  --ok:#5c8f72; --warn:#bb7d49; --err:#b2635a;
  --maxw:1180px;
  --f-display:"Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --course:#c8932e;
}
body[data-exam="CAT"]{--course:#c8932e}
body[data-exam="GMAT"]{--course:#a8705f}
body[data-exam="GRE"]{--course:#6a6f9c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5;
  min-height:100vh;position:relative;overflow-x:hidden;background:linear-gradient(168deg,var(--ink),var(--ink-2))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 50% -10%, color-mix(in srgb,var(--course) 12%,transparent), transparent 62%)}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 28px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.testbar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 94%,transparent),color-mix(in srgb,var(--ink) 66%,transparent));
  backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid color-mix(in srgb,var(--course) 30%,var(--line))}
.testbar .wrap{display:flex;align-items:center;gap:16px;width:100%}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:19px}
.tmock{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-left:1px solid var(--line);padding-left:16px}
.tmock b{color:var(--course)}
.tclock{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--gold-ink);background:color-mix(in srgb,var(--course) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--course) 26%,var(--line-soft));border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:8px}
.tclock i{width:6px;height:6px;border-radius:50%;background:var(--course);animation:blink 1.4s ease infinite}
.tclock small{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-4);font-weight:600}
.tclock.hide{display:none}
@keyframes blink{50%{opacity:.35}}
.hsubmit{font-family:var(--f-body);font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:8px;color:#fff;background:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold-ink) 52%,#000);transition:transform .16s}
.hsubmit:hover{transform:translateY(-1px)}

.arena{display:grid;grid-template-columns:1fr 250px;gap:24px;padding:24px 0 30px;align-items:start}
@media(max-width:900px){.arena{grid-template-columns:1fr}}
.qcard{border:1px solid var(--line-soft);border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,var(--panel-2));padding:26px 30px 24px;min-height:420px;display:flex;flex-direction:column}
.qtop{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line-soft);margin-bottom:20px}
.qtop .qn{font-family:var(--f-display);font-weight:800;font-size:20px}
.qtop .qn small{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--text-4)}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;border:1px solid var(--line-soft);background:var(--panel);color:var(--text-3)}
.qstem{font-size:17px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:16px}
.qimg{max-width:100%;border-radius:10px;margin-bottom:16px;border:1px solid var(--line-soft)}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:auto}
.opt{display:flex;align-items:center;gap:15px;padding:15px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;transition:border-color .16s,transform .14s,background .16s}
.opt:hover{border-color:color-mix(in srgb,var(--course) 42%,var(--line));transform:translateX(2px)}
.opt .ol{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--text-3);transition:all .16s}
.opt .otx{font-size:15.5px;color:var(--text-2)}
.opt.sel{border-color:var(--course);background:color-mix(in srgb,var(--course) 7%,var(--panel))}
.opt.sel .ol{background:var(--course);color:#fff;border-color:var(--course)}
.tita{margin-top:auto}
.tita input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;font-family:var(--f-mono);font-size:16px;color:var(--text)}
.tita input:focus{outline:none;border-color:color-mix(in srgb,var(--course) 50%,var(--line))}
.qactions{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-soft)}
.btn{font-family:var(--f-body);font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:9px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:9px;transition:border-color .16s,background .16s,transform .14s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--course);color:#fff;border-color:color-mix(in srgb,var(--course) 70%,#000)}
.btn-ghost{background:var(--panel);color:var(--text-2)}
.btn-ghost:hover{border-color:var(--text-3)}
.btn-ghost.prev{margin-right:auto}
.btn.is-off{opacity:.38;cursor:not-allowed;pointer-events:none}
.btn.is-finish{background:var(--gold-ink);border-color:color-mix(in srgb,var(--gold-ink) 55%,#000);color:#fff}

.prail{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.pcard{border:1px solid var(--line-soft);border-radius:13px;background:color-mix(in srgb,var(--brand) 4%,var(--panel-2));padding:18px}
.pcard .pch{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:13px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pq{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--text-3);display:grid;place-items:center;cursor:pointer;transition:all .14s}
.pq:hover{transform:translateY(-2px)}
.pq.ans{background:color-mix(in srgb,var(--ok) 20%,var(--panel));border-color:color-mix(in srgb,var(--ok) 48%,var(--line));color:var(--ok)}
.pq.cur{background:var(--course);border-color:var(--course);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--course) 22%,transparent)}
.plegend{display:flex;flex-direction:column;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.pl{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:10.5px;color:var(--text-3)}
.pl i{width:13px;height:13px;border-radius:4px;flex:0 0 auto}
.summ{display:flex;flex-direction:column;gap:11px}
.srow{display:flex;align-items:center;justify-content:space-between}
.srow .sl{font-size:13px;color:var(--text-3)}
.srow .sv{font-family:var(--f-mono);font-weight:600;font-size:15px}

/* overlay (intro + result) */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:28px;
  background:color-mix(in srgb,var(--ink) 62%,transparent);backdrop-filter:blur(6px)}
.ov.hide{display:none}
.ovcard{max-width:560px;width:100%;border:1px solid var(--line-soft);border-radius:16px;background:linear-gradient(168deg,var(--panel),var(--panel-2));padding:34px 34px 28px;box-shadow:0 30px 80px rgba(20,18,15,.28)}
.ovk{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4);margin-bottom:10px}
.ovcard h2{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:28px;margin-bottom:6px}
.ovmeta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ovinstr{font-size:14px;color:var(--text-2);line-height:1.6;margin:12px 0 6px;white-space:pre-wrap}
.ovbtns{display:flex;gap:12px;margin-top:22px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.rstat{border:1px solid var(--line-soft);border-radius:10px;background:color-mix(in srgb,var(--brand) 6%,var(--panel-2));padding:14px 16px;text-align:center}
.rstat .rn{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--gold-ink)}
.rstat .rl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);margin-top:6px}
.rsec{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rsrow{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.rsrow:last-child{border-bottom:none}
.rsrow .rsn{font-weight:600}
.rsrow .rsv{font-family:var(--f-mono);color:var(--text-3)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-exam="CAT">
<div class="testbar">
  <div class="wrap">
    <div class="logo">▲ <span>VettaLume</span></div>
    <div class="tmock" id="tmock">Mock</div>
    <div class="tclock hide" id="clockBox"><i></i><span id="clock">--:--</span><small>left</small></div>
    <button class="hsubmit" id="hSubmit">Submit</button>
  </div>
</div>

<div class="wrap">
  <div class="arena">
    <div class="qcard">
      <div class="qtop">
        <div class="qn">Question <span id="qNum">01</span> <small id="ofN">/ 0</small></div>
        <span class="tag" id="tSec">—</span>
      </div>
      <div id="qbody"></div>
      <div class="qactions">
        <button class="btn btn-ghost prev" id="prevBtn">&larr; Previous</button>
        <button class="btn btn-ghost" id="clearBtn">Clear</button>
        <button class="btn btn-primary" id="nextBtn">Save &amp; next <span>&rarr;</span></button>
      </div>
    </div>
    <aside class="prail">
      <div class="pcard">
        <div class="pch">Question palette</div>
        <div class="pgrid" id="pgrid"></div>
        <div class="plegend">
          <span class="pl"><i style="background:color-mix(in srgb,var(--ok) 20%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 48%,var(--line))"></i>Answered</span>
          <span class="pl"><i style="background:var(--course);border:1px solid var(--course)"></i>Current</span>
          <span class="pl"><i style="background:var(--panel);border:1px solid var(--line)"></i>Not answered</span>
        </div>
      </div>
      <div class="pcard">
        <div class="pch">This test</div>
        <div class="summ">
          <div class="srow"><span class="sl">Answered</span><span class="sv" style="color:var(--ok)" id="sAns">0</span></div>
          <div class="srow"><span class="sl">Not answered</span><span class="sv" style="color:var(--text-3)" id="sRem">0</span></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- intro overlay -->
<div class="ov" id="intro">
  <div class="ovcard">
    <div class="ovk">Mock test</div>
    <h2 id="introName">Loading…</h2>
    <div class="ovmeta" id="introMeta"></div>
    <div class="ovinstr" id="introInstr"></div>
    <div class="ovbtns">
      <button class="btn btn-ghost" id="introBack">&larr; Back</button>
      <button class="btn btn-primary" id="introStart" style="margin-left:auto">Start test <span>&rarr;</span></button>
    </div>
  </div>
</div>

<!-- result overlay -->
<div class="ov hide" id="result">
  <div class="ovcard">
    <div class="ovk">Submitted</div>
    <h2 id="resName">Your result</h2>
    <div class="rgrid" id="resStats"></div>
    <div class="rsec" id="resSecs"></div>
    <div class="ovbtns">
      <button class="btn btn-primary" id="resBack" style="margin-left:auto">Back to mocks <span>&rarr;</span></button>
    </div>
  </div>
</div>

<script>
var LETTERS=["A","B","C","D","E","F"];
var qp=new URLSearchParams(location.search);
var exam=(qp.get('exam')||'cat').toLowerCase(), EX=exam.toUpperCase();
var mockId=qp.get('mock')||'';
var api=qp.get('api')||'http://localhost:8001';
var token=null; try{token=localStorage.getItem('vetta:token');}catch(e){}
var H=token?{Authorization:'Bearer '+token}:{};
document.body.setAttribute('data-exam',EX);

var PAPER=null, FLAT=[], ANS={}, cur=0, timer=null, tRemain=0, submitted=false;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isTita(q){return !(q.options&&q.options.length);}
function backToList(){ top.location.href='/mocks/'+exam+'/'+(PAPER&&PAPER.type==='sectional'?'sectional':'full'); }

// ----- load -----
document.getElementById('introBack').addEventListener('click',backToList);
document.getElementById('resBack').addEventListener('click',backToList);
fetch(api+'/mocks/'+encodeURIComponent(mockId),{headers:H}).then(function(r){return r.json();}).then(function(d){
  if(!d||!d.sections){ document.getElementById('introName').textContent='Mock not found'; return; }
  PAPER=d;
  (d.sections||[]).forEach(function(s){ (s.questions||[]).forEach(function(q){ FLAT.push({sname:s.name,q:q}); }); });
  document.getElementById('introName').textContent=d.name;
  document.getElementById('tmock').innerHTML='<b>'+esc(d.name)+'</b>';
  var mins=d.duration||0; if(!mins){ (d.sections||[]).forEach(function(s){mins+=parseInt(s.time||0,10)||0;}); }
  PAPER._mins=mins;
  var meta='<span class="tag">'+FLAT.length+' questions</span>';
  if(mins) meta+='<span class="tag">'+mins+' min</span>';
  if(d.type==='full') meta+='<span class="tag">+'+(d.scoringMarks||1)+' / -'+(d.scoringNeg||0)+'</span>';
  else if(d.negative) meta+='<span class="tag">-'+d.negative+' negative</span>';
  document.getElementById('introMeta').innerHTML=meta;
  document.getElementById('introInstr').textContent=d.instructions||'Answer the questions and submit when done. You can navigate with the palette.';
}).catch(function(){ document.getElementById('introName').textContent='Could not load this mock'; });

// ----- start -----
document.getElementById('introStart').addEventListener('click',function(){
  if(!PAPER||!FLAT.length) return;
  document.getElementById('intro').classList.add('hide');
  cur=0; renderQ(); renderPalette(); updateSummary();
  if(PAPER._mins>0){ startTimer(PAPER._mins); document.getElementById('clockBox').classList.remove('hide'); }
});

function startTimer(mins){
  tRemain=mins*60; paintClock();
  timer=setInterval(function(){ if(tRemain<=0){clearInterval(timer); doSubmit(); return;} tRemain--; paintClock(); },1000);
}
function paintClock(){ var m=Math.floor(tRemain/60), s=tRemain%60; document.getElementById('clock').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

// ----- render -----
function renderQ(){
  var item=FLAT[cur]; if(!item) return; var q=item.q;
  document.getElementById('qNum').textContent=(cur<9?'0':'')+(cur+1);
  document.getElementById('ofN').textContent='/ '+FLAT.length;
  document.getElementById('tSec').textContent=item.sname||'';
  var body=document.getElementById('qbody'), html='';
  if(q.image) html+='<img class="qimg" src="'+esc(q.image)+'" alt="">';
  html+='<div class="qstem">'+esc(q.text)+'</div>';
  if(isTita(q)){
    html+='<div class="tita"><input id="titaInput" type="text" placeholder="Type your answer" value="'+esc(ANS[q.id]!=null?ANS[q.id]:'')+'"></div>';
    body.innerHTML=html;
    var inp=document.getElementById('titaInput');
    inp.addEventListener('input',function(){ var v=inp.value.trim(); if(v==='') delete ANS[q.id]; else ANS[q.id]=v; renderPalette(); updateSummary(); });
  }else{
    html+='<div class="opts" id="opts">';
    (q.options||[]).forEach(function(o,i){
      html+='<div class="opt'+(ANS[q.id]===i?' sel':'')+'" data-i="'+i+'"><div class="ol">'+(LETTERS[i]||(i+1))+'</div><div class="otx">'+esc(o)+'</div></div>';
    });
    html+='</div>';
    body.innerHTML=html;
    body.querySelectorAll('#opts .opt').forEach(function(el){
      el.addEventListener('click',function(){
        ANS[q.id]=parseInt(el.getAttribute('data-i'),10);
        body.querySelectorAll('#opts .opt').forEach(function(x){x.classList.remove('sel');});
        el.classList.add('sel'); renderPalette(); updateSummary();
      });
    });
  }
  document.getElementById('prevBtn').classList.toggle('is-off', cur<=0);
  var nb=document.getElementById('nextBtn'); nb.classList.remove('is-finish');
  if(cur<FLAT.length-1){ nb.innerHTML='Save &amp; next <span>&rarr;</span>'; }
  else { nb.innerHTML='Submit test'; nb.classList.add('is-finish'); }
  postH();
}
function renderPalette(){
  var grid=document.getElementById('pgrid'), g='';
  FLAT.forEach(function(item,i){
    var cls = i===cur ? 'cur' : (ANS[item.q.id]!=null && ANS[item.q.id]!=='' ? 'ans':'');
    g+='<div class="pq '+cls+'" data-i="'+i+'">'+(i+1)+'</div>';
  });
  grid.innerHTML=g;
  grid.querySelectorAll('.pq').forEach(function(el){ el.addEventListener('click',function(){ cur=parseInt(el.getAttribute('data-i'),10); renderQ(); renderPalette(); }); });
}
function updateSummary(){
  var ans=FLAT.filter(function(it){return ANS[it.q.id]!=null && ANS[it.q.id]!=='';}).length;
  document.getElementById('sAns').textContent=ans;
  document.getElementById('sRem').textContent=FLAT.length-ans;
}

document.getElementById('prevBtn').addEventListener('click',function(){ if(cur>0){cur--;renderQ();renderPalette();} });
document.getElementById('clearBtn').addEventListener('click',function(){ var q=FLAT[cur].q; delete ANS[q.id]; renderQ(); renderPalette(); updateSummary(); });
document.getElementById('nextBtn').addEventListener('click',function(){ if(cur<FLAT.length-1){cur++;renderQ();renderPalette();} else doSubmit(); });
document.getElementById('hSubmit').addEventListener('click',doSubmit);

// ----- submit -----
function doSubmit(){
  if(submitted) return; submitted=true;
  if(timer) clearInterval(timer);
  fetch(api+'/mocks/'+encodeURIComponent(mockId)+'/submit',{method:'POST',
    headers:Object.assign({'Content-Type':'application/json'},H), body:JSON.stringify({answers:ANS})})
    .then(function(r){return r.json();}).then(showResult)
    .catch(function(){ submitted=false; alert('Could not submit — check your connection and try again.'); });
}
function showResult(res){
  if(!res||!res.overall){ backToList(); return; }
  var o=res.overall;
  document.getElementById('resName').textContent=res.name+' — result';
  var pct=Math.round((o.accuracy||0)*100);
  document.getElementById('resStats').innerHTML=
    '<div class="rstat"><div class="rn">'+o.score+'</div><div class="rl">Score</div></div>'+
    '<div class="rstat"><div class="rn">'+o.raw+'/'+o.total+'</div><div class="rl">Correct</div></div>'+
    '<div class="rstat"><div class="rn">'+pct+'%</div><div class="rl">Accuracy</div></div>';
  document.getElementById('resSecs').innerHTML=(res.sections||[]).map(function(s){
    return '<div class="rsrow"><span class="rsn">'+esc(s.name)+'</span><span class="rsv">'+s.raw+'/'+s.total+' · '+Math.round((s.accuracy||0)*100)+'% · '+s.score+' pts</span></div>';
  }).join('');
  document.getElementById('result').classList.remove('hide');
}

function postH(){/* fill mode: iframe scrolls internally; no height post needed */}
</script>
</body>
</html>
