<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vetta Lume — Mock Test Attempt</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..800&family=Montserrat:wght@600..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================== TOKENS ============================== */
:root{
  --bg:#f6f2e9; --bg-glow:#efe8d3;
  --panel:#fbfaf7; --panel-2:#f4ecd8; --panel-3:#efe8d3;
  --line:rgba(30,26,18,.12); --line-2:rgba(30,26,18,.22);
  --text:#1d1f24; --soft:#4a4d54; --muted:#5c5f66; --dim:#8b8d92;
  --violet:#c9a24e; --violet-2:#d9b96a; --violet-deep:#8a6d28; --violet-bg:rgba(201,162,78,.14);
  --gold:#8a6d28; --gold-dot:#c9a24e;
  --green:#3c7d5f; --green-bg:rgba(79,155,134,.16);
  --amber:#dca43f; --amber-bg:rgba(220,164,63,.16);
  --red:#b2847a; --red-bg:rgba(178,132,122,.16);
  --blue:#797ea4; --blue-bg:rgba(121,126,164,.16);
  --radius:18px; --radius-sm:12px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 72% -10%,var(--bg-glow),transparent 62%),var(--bg);
  background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:'Montserrat',sans-serif;font-weight:800;}

/* ============================== APP BAR ============================== */
#appbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px clamp(16px,3vw,34px);background:rgba(246,242,233,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.bar-left{display:flex;align-items:center;gap:16px;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-dot);box-shadow:0 0 15px 1px rgba(205,163,92,.6);}
.brand .name{font-family:Georgia,serif;font-size:22px;color:var(--gold);font-weight:500;}
.brand .name i{font-style:italic;font-weight:400;opacity:.92;}
.vrule{width:1px;height:30px;background:var(--line-2);}
.exam-ctx .mock{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
.exam-ctx .sec{font-size:15px;color:var(--text);margin-top:2px;}
.mode-switch{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:auto;}
.mode-switch button{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.07em;color:var(--muted);background:transparent;border:none;cursor:pointer;padding:8px 17px;border-radius:999px;transition:all .25s var(--ease);}
.mode-switch button:hover{color:var(--soft);}
.mode-switch button.active{background:linear-gradient(180deg,var(--panel-3),var(--panel-2));color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);}
.bar-right{display:flex;align-items:center;gap:14px;}
.clock{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--text);letter-spacing:.02em;padding:7px 15px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);min-width:84px;text-align:center;transition:color .3s,border-color .3s;}
.clock.small{font-size:15px;padding:5px 11px;min-width:64px;}
.clock.low{color:var(--amber);border-color:rgba(228,178,102,.4);}
.clock.crit{color:var(--red);border-color:rgba(214,124,114,.5);}

/* ============================== BUTTONS ============================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:'Hanken Grotesk',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:11px;padding:11px 20px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--soft);transition:transform .25s var(--ease),border-color .25s,background .25s,box-shadow .25s;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);border-color:var(--line-2);color:var(--text);background:var(--panel-3);}
.btn:active{transform:translateY(0);}
.btn.primary{color:#0c0a14;background:linear-gradient(180deg,var(--violet-2),var(--violet));border-color:transparent;box-shadow:0 10px 26px -14px rgba(201,162,78,.85);}
.btn.primary:hover{background:linear-gradient(180deg,#D6CCFF,var(--violet-2));color:#0c0a14;}
.btn.review{color:var(--blue);background:var(--blue-bg);border-color:rgba(116,166,224,.3);}
.btn.review:hover{color:var(--blue);background:rgba(116,166,224,.22);}
.btn.ghost{background:transparent;}
.btn.wide{width:100%;justify-content:center;text-align:center;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ============================== PROGRESSION ============================== */
#progression{padding:18px clamp(16px,3vw,34px) 4px;}
.prog{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.step{display:flex;align-items:center;gap:11px;padding:8px 4px;position:relative;}
.step .conn{width:34px;height:1px;background:var(--line-2);margin-right:7px;}
.step .dotn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2);flex-shrink:0;}
.step .lbl{font-size:13px;color:var(--muted);white-space:nowrap;}
.step.done .dotn{background:var(--green-bg);border-color:rgba(111,196,160,.4);color:var(--green);}
.step.done .lbl{color:var(--soft);}
.step.current .dotn{background:linear-gradient(180deg,var(--violet-2),var(--violet));border-color:transparent;color:#0c0a14;box-shadow:0 0 0 4px var(--violet-bg);}
.step.current .lbl{color:var(--text);}
.step.locked{opacity:.55;}

/* ============================== LAYOUT ============================== */
main#stage{padding:14px clamp(16px,3vw,34px) 60px;}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;animation:fade .4s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* question card */
.qcard{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;}
.qcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.qnum{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--text);font-weight:500;}
.qnum .of{color:var(--dim);font-size:14px;}
.qtopic{font-size:12.5px;color:var(--muted);margin-top:4px;}
.marks{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);background:var(--panel-3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;white-space:nowrap;}
.passage,.datablock,.figblock{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px 20px;margin-bottom:20px;}
.figblock{text-align:center;}
.figblock svg{max-height:200px;}
.passage{font-family:Georgia,serif;font-size:15.5px;line-height:1.62;color:var(--soft);}
.passage .pg-l,.datablock .pg-l,.figblock .pg-l{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.stem{font-size:16.5px;line-height:1.55;color:var(--text);white-space:pre-line;margin-bottom:22px;}
table.dblk{width:100%;border-collapse:collapse;margin-top:4px;}
table.dblk th,table.dblk td{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;padding:8px 12px;border:1px solid var(--line);}
table.dblk th{color:var(--dim);background:var(--panel-3);font-weight:500;}
table.dblk td:first-child,table.dblk th:first-child{text-align:left;color:var(--soft);}

/* options */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:all .22s var(--ease);font-family:inherit;color:var(--soft);}
.opt:hover{border-color:var(--line-2);background:var(--panel-3);color:var(--text);transform:translateX(2px);}
.opt-key{width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);transition:all .22s var(--ease);}
.opt-txt{font-size:14.5px;line-height:1.4;}
.opt.sel{border-color:rgba(174,160,238,.55);background:var(--violet-bg);color:var(--text);}
.opt.sel .opt-key{background:linear-gradient(180deg,var(--violet-2),var(--violet));border-color:transparent;color:#0c0a14;}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line);}
.actions.center{justify-content:center;border-top:none;}
.gmat-actions{justify-content:space-between;align-items:center;}
.gmat-actions .hint{font-size:12.5px;color:var(--dim);}
.spacer{flex:1;}

/* ============================== SIDE PANEL ============================== */
.side{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px;height:fit-content;position:sticky;top:84px;}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;}
.side-sec{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px;}
.lg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
.lg .sw{width:13px;height:13px;border-radius:4px;border:1px solid var(--line-2);flex-shrink:0;}
.sw.nv{background:var(--panel-2);} .sw.ans{background:var(--green-bg);border-color:rgba(111,196,160,.5);}
.sw.skip{background:var(--red-bg);border-color:rgba(214,124,114,.5);} .sw.rev{background:var(--blue-bg);border-color:rgba(116,166,224,.5);}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.cnt{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
.cnt .n{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--text);}
.cnt .k{font-size:10.5px;color:var(--muted);margin-top:2px;}
.cnt.ans .n{color:var(--green);} .cnt.rev .n{color:var(--blue);} .cnt.skip .n{color:var(--red);}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px;}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12.5px;cursor:pointer;transition:all .2s var(--ease);display:grid;place-items:center;}
.cell:hover{transform:translateY(-2px);border-color:var(--line-2);}
.cell.ans{background:var(--green-bg);border-color:rgba(111,196,160,.4);color:var(--green);}
.cell.skip{background:var(--red-bg);border-color:rgba(214,124,114,.4);color:var(--red);}
.cell.rev{background:var(--blue-bg);border-color:rgba(116,166,224,.4);color:var(--blue);}
.cell.cur{box-shadow:0 0 0 2px var(--violet),0 0 0 5px var(--violet-bg);border-color:transparent;color:var(--text);}

/* GMAT progress card */
.progress-card{padding:4px 0 0;}
.pc-row{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-bottom:10px;}
.pc-row .v{font-family:'IBM Plex Mono',monospace;color:var(--text);}
.pc-bar{height:7px;background:var(--panel-3);border-radius:999px;overflow:hidden;margin-bottom:16px;}
.pc-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet-deep),var(--violet));transition:width .5s var(--ease);}
.pc-status{font-size:12.5px;color:var(--muted);line-height:1.5;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;}
.pc-seq{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.seq-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.seq-row .sd{width:8px;height:8px;border-radius:50%;background:var(--panel-3);border:1px solid var(--line-2);}
.seq-row.done .sd{background:var(--green);} .seq-row.done{color:var(--soft);}
.seq-row.cur .sd{background:var(--violet);box-shadow:0 0 8px var(--violet);} .seq-row.cur{color:var(--text);}

/* ============================== ESSAY ============================== */
.essay-wrap{max-width:860px;margin:8px auto 0;animation:fade .4s var(--ease);}
.essay-head{text-align:center;margin-bottom:24px;}
.essay-head .eh-title{font-family:Georgia,serif;font-size:34px;color:var(--text);letter-spacing:-.01em;}
.essay-head .eh-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:8px;}
.prompt-card{background:linear-gradient(180deg,var(--violet-bg),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;}
.prompt-card .pc-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);margin-bottom:12px;}
.prompt-card p{font-family:Georgia,serif;font-size:18px;line-height:1.55;color:var(--text);}
.prompt-card p.task{font-family:'Hanken Grotesk',sans-serif;font-size:13.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.editor textarea{width:100%;min-height:340px;resize:vertical;background:transparent;border:none;outline:none;color:var(--text);font-family:Georgia,serif;font-size:16.5px;line-height:1.7;padding:24px 26px;}
.editor textarea::placeholder{color:var(--dim);}
.editor-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel-2);}
.wc{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);}
.wc span{color:var(--text);}

/* ============================== TRANSITION / COMPLETE ============================== */
.center-screen{display:flex;justify-content:center;padding:40px 0;animation:fade .4s var(--ease);}
.result-card{max-width:560px;width:100%;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.014),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:44px 40px;}
.result-card .check{width:62px;height:62px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;font-size:28px;color:var(--green);background:var(--green-bg);border:1px solid rgba(111,196,160,.4);}
.result-card .badge-done{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet);background:var(--violet-bg);border:1px solid rgba(174,160,238,.3);border-radius:999px;padding:7px 16px;margin-bottom:20px;}
.result-card h2{font-family:Georgia,serif;font-weight:400;font-size:30px;color:var(--text);letter-spacing:-.01em;line-height:1.2;}
.result-card p{font-size:14.5px;color:var(--muted);margin-top:12px;line-height:1.55;}
.mini-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px 0 28px;}
.ms{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:13px 18px;min-width:96px;}
.ms .n{font-family:'IBM Plex Mono',monospace;font-size:21px;color:var(--text);}
.ms .k{font-size:10.5px;color:var(--muted);letter-spacing:.05em;margin-top:3px;text-transform:uppercase;}

/* ============================== SECTION SELECT ============================== */
.select-screen{max-width:780px;margin:12px auto 0;animation:fade .4s var(--ease);}
.select-head{text-align:center;margin-bottom:26px;}
.select-head .sh-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.select-head h2{font-family:Georgia,serif;font-weight:400;font-size:31px;color:var(--text);letter-spacing:-.01em;}
.select-head p{font-size:14px;color:var(--muted);margin:12px auto 0;max-width:580px;line-height:1.55;}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(234px,1fr));gap:14px;}
.sec-tile{background:linear-gradient(180deg,rgba(255,255,255,.013),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;}
.sec-tile:not(.is-done):hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 18px 40px -28px rgba(0,0,0,.8);}
.sec-tile.is-done{opacity:.66;}
.sec-tile.is-locked{opacity:.62;}
.st-status.locked{color:var(--amber);}
.is-locked .st-idx{color:var(--muted);background:var(--panel-3);border-color:var(--line);}
.is-locked .btn svg{width:11px;height:11px;}
.st-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.st-idx{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;color:var(--violet);background:var(--violet-bg);border:1px solid rgba(174,160,238,.26);border-radius:8px;padding:5px 11px;}
.is-done .st-idx{color:var(--green);background:var(--green-bg);border-color:rgba(111,196,160,.3);}
.st-status{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.st-status.done{color:var(--green);}
.st-name{font-size:15.5px;color:var(--text);font-weight:500;line-height:1.32;}
.st-sub{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
.st-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);margin:13px 0 18px;}
.sec-tile .btn{margin-top:auto;}
.step.pending{opacity:.55;}

/* ============================== RESPONSIVE ============================== */
@media (max-width:960px){
  .layout{grid-template-columns:1fr;}
  .side{position:static;}
  .palette{grid-template-columns:repeat(10,1fr);}
}
@media (max-width:640px){
  #appbar{gap:12px;}
  .vrule,.exam-ctx .mock{display:none;}
  .mode-switch{margin-left:0;order:3;width:100%;justify-content:center;}
  .bar-right{margin-left:auto;}
  .palette{grid-template-columns:repeat(6,1fr);}
  .qcard{padding:22px 18px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px;}

/* instructions screen */
.result-card.instr{ text-align:left; max-width:600px; }
.result-card.instr h2{ text-align:left; margin-bottom:6px; }
.instr-list{ margin:16px 0 6px; padding-left:18px; display:flex; flex-direction:column; gap:9px; color:var(--soft); font-size:14px; }
.instr-list li{ line-height:1.5; }
</style>
</head>
<body>
  <div id="app">
    <header id="appbar"></header>
    <div id="progression"></div>
    <main id="stage"></main>
  </div>

<script>
/* =========================================================
   SAMPLE CONTENT
   ========================================================= */
const PASS_ATT = `In the modern economy, attention functions as a kind of currency. As the volume of available information expands, the truly scarce resource is no longer content but the capacity to attend to it. Firms compete not merely for consumers' money but for their gaze, designing products whose chief purpose is to capture and hold focus. Critics argue that this contest reshapes culture itself — rewarding whatever is most immediately arresting over whatever is most worth knowing.`;
const PASS_CORAL = `Coral reefs, though they occupy less than one percent of the ocean floor, shelter roughly a quarter of all marine species. Their resilience, long taken for granted, now appears unexpectedly fragile: even a modest rise in water temperature can trigger the expulsion of the algae on which corals depend, draining them of colour and, in time, of life.`;
const TABLE = `<table class="dblk"><thead><tr><th>Quarter</th><th>Alpha</th><th>Beta</th><th>Gamma</th></tr></thead><tbody><tr><td>Q1</td><td>120</td><td>90</td><td>140</td></tr><tr><td>Q2</td><td>160</td><td>110</td><td>130</td></tr><tr><td>Q3</td><td>150</td><td>120</td><td>170</td></tr><tr><td>Q4</td><td>180</td><td>100</td><td>160</td></tr></tbody></table>`;
const ESSAY_PROMPT = `"Institutions should value innovation over the preservation of tradition, because meaningful progress depends on a willingness to discard established ways of doing things."`;

/* Inline figure illustrations (self-contained, theme-aware). Any question may carry an `img`

let app = { examKey:'CAT', stageIndex:0, qIndex:0, phase:'select', P:{}, remaining:0, tick:null, done:new Set() };
const curExam = () => EXAMS[app.examKey];
const curStage = () => curExam().stages[app.stageIndex];
const lockSvg = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function initExam(key){
  app.examKey=key; app.stageIndex=0; app.qIndex=0; app.P={}; app.done=new Set();
  curExam().stages.forEach(s=>{
    app.P[s.id] = s.layout==='essay'
      ? { essay:'' }
      : { ans:Array(s.count).fill(null), visited:Array(s.count).fill(false), marked:Array(s.count).fill(false) };
  });
  stopTimer(); app.phase='select'; renderShell();
}
function startSection(idx){ app.stageIndex=idx; startStage(); }
function startStage(){
  app.qIndex=0; app.phase='attempt'; app.remaining=curStage().dur;
  startTimer(); renderShell();
}
function startTimer(){
  clearInterval(app.tick);
  app.tick = setInterval(()=>{
    app.remaining--;
    if(app.remaining<=0){ app.remaining=0; updateClocks(); clearInterval(app.tick); submitStage(); return; }
    updateClocks();
  },1000);
}
function stopTimer(){ clearInterval(app.tick); app.tick=null; }
function submitStage(){ app.done.add(curStage().id); stopTimer(); app.phase='transition'; renderShell(); }
function proceed(){
  if(curExam().stages.some(s=>!app.done.has(s.id))){ stopTimer(); app.phase='select'; renderShell(); }
  else finish();
}
function finish(){
  stopTimer(); app.phase='complete';
  if(app.mode==='diagnostic'){
    let answered=0,total=0;
    curExam().stages.forEach(s=>{ if(s.layout!=='essay'){ total+=s.count; answered+=tally(app.P[s.id],s.count).ans; } });
    const ratio = total?answered/total:0;
    const percentile = Math.min(99, Math.max(35, Math.round(42 + ratio*52)));
    app._diag = {percentile, answered, total};
    try{ localStorage.setItem('vetta:diagnostic', JSON.stringify({percentile,answered,total,exam:app.launchExam,date:Date.now()})); }catch(e){}
  }
  renderShell();
}
function leave(){ const P=app.P[curStage().id]; if(P.visited) P.visited[app.qIndex]=true; }

/* =========================================================
   HELPERS
   ========================================================= */
const fmtT = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const key = i => String.fromCharCode(65+i);
function question(stage,i){ const pool=POOLS[stage.pool]; return pool[i % pool.length]; }
function cellState(P,i){ if(P.marked[i]) return 'rev'; if(P.ans[i]!=null) return 'ans'; if(P.visited[i]) return 'skip'; return 'nv'; }
function tally(P,count){ const c={ans:0,rev:0,skip:0,nv:0}; for(let i=0;i<count;i++) c[cellState(P,i)]++; return c; }
function countWords(s){ s=s.trim(); return s? s.split(/\s+/).length : 0; }
function updateClocks(){
  const t=fmtT(app.remaining);
  const cls = app.remaining<=60?'crit':app.remaining<=300?'low':'';
  [['clock','clock'],['clock2','clock small']].forEach(([id,base])=>{
    const n=document.getElementById(id);
    if(n){ n.textContent=t; n.className=base+(cls?' '+cls:''); }
  });
}

function headerHTML(){

    <div class="bar-right">${right}</div>`;
}
function progressionHTML(){
  if(app.phase==='select' || app.phase==='complete' || app.phase==='instructions') return '';

  return `<div class="prog">${ex.stages.map((st,i)=>{
    const isDone = app.done.has(st.id);
    const isCur = (app.phase==='attempt'||app.phase==='transition') && i===app.stageIndex && !isDone;
    const cls = isDone?'done' : isCur?'current' : 'pending';
    const icon = isDone?'✓' : (i+1);
    return `<div class="step ${cls}">${i>0?'<span class="conn"></span>':''}<span class="dotn">${icon}</span><span class="lbl">${ex.progression[i]}</span></div>`;

/* ---- section select / launch hub ---- */
const CODES = {varc:'VARC',dilr:'DILR',qa:'QA', gq:'QA',gv:'VR',gd:'DI', gv1:'V · 1',gv2:'V · 2',gq1:'Q · 1',gq2:'Q · 2', essay:'AWA'};
function selectHTML(){
  const ex=curExam();
  const tiles = ex.stages.map((s,i)=>{
    const done = app.done.has(s.id);
    const req  = s.requires ? ex.stages.find(x=>x.id===s.requires) : null;
    const locked = !done && req && !app.done.has(req.id);
    const reqName = req ? `${req.section}${req.sub?' · '+req.sub:''}` : '';
    const name = s.layout==='essay' ? 'Analytical Writing Assessment' : `${s.section}${s.sub?' · '+s.sub:''}`;
    const sub  = s.layout==='essay' ? 'Analyze an Issue' : ((s.label && s.label!==s.section) ? s.label : '');
    const meta = s.layout==='essay' ? `Written response · ${s.dur/60} min` : `${s.count} questions · ${s.dur/60} min`;
    const status = done?'<span class="st-status done">Completed</span>' : locked?'<span class="st-status locked">Locked</span>' : '<span class="st-status">Not started</span>';
    let btn;
    if(done) btn = `<button class="btn ghost wide" disabled>Completed ✓</button>`;
    else if(locked) btn = `<button class="btn ghost wide" disabled>${lockSvg} Unlocks after ${reqName}</button>`;
    else btn = `<button class="btn primary wide" data-action="startSection" data-stage="${i}">Start section →</button>`;
    return `<div class="sec-tile ${done?'is-done':''} ${locked?'is-locked':''}">
      <div class="st-top"><span class="st-idx">${CODES[s.id]||s.section}</span>${status}</div>
      <div class="st-name">${name}</div>
      ${sub?`<div class="st-sub">${sub}</div>`:''}
      <div class="st-meta">${meta}</div>
      ${btn}
    </div>`;
  }).join('');
  const allDone = ex.stages.every(s=>app.done.has(s.id));
  return `<div class="select-screen">
    <div class="select-head">
      <div class="sh-kicker">${ex.title}</div>
      <h2>Choose a section to begin</h2>
      <p>Attempt the sections in any order you like. Once you start a section, finish and submit it before moving on — submitted sections can't be reopened.</p>
    </div>
    <div class="sec-grid">${tiles}</div>
    ${allDone?`<div class="actions center" style="margin-top:26px"><button class="btn primary" data-action="proceed">See your summary →</button></div>`:''}
  </div>`;
}

      <div class="actions gmat-actions">
        <div class="hint">Select an answer, then submit to continue. Questions cannot be revisited.</div>
        <button class="btn primary" data-action="submitQ" ${P.ans[i]==null?'disabled':''}>Submit Question →</button>
      </div>
    </section>
    <aside class="side">
      <div class="side-head"><div class="side-sec">${s.section}</div><div class="clock small" id="clock2"></div></div>
      <div class="progress-card">
        <div class="pc-row"><span>Completed</span><span class="v mono">${i} / ${s.count}</span></div>
        <div class="pc-bar"><span style="width:${pct}%"></span></div>
        <div class="pc-status">This section is adaptive. You must submit the current question to continue, and earlier questions cannot be reopened.</div>
        <div class="pc-seq">${seq}</div>
      </div>
      <button class="btn ghost wide" data-action="submitStage">End Section</button>
    </aside>
  </div>`;
}

/* ---- GRE essay ---- */
function essayHTML(s){
  const P=app.P[s.id];
  return `<div class="essay-wrap">
    <div class="essay-head">
      <div class="eh-title">Analytical Writing Assessment</div>
      <div class="eh-sub">Analyze an Issue · 30 minutes</div>
    </div>
    <div class="prompt-card">
      <div class="pc-label">Issue Prompt</div>
      <p>${s.prompt}</p>
      <p class="task">Write a response in which you discuss the extent to which you agree or disagree with the statement and explain your reasoning. In developing your position, consider ways in which the statement might or might not hold true, and how those considerations shape your view.</p>
    </div>
    <div class="editor">
      <textarea data-role="essay" placeholder="Begin typing your response…">${P.essay||''}</textarea>
      <div class="editor-foot">
        <div class="wc"><span id="wordcount">${countWords(P.essay||'')}</span> words</div>
        <div class="clock small" id="clock2"></div>
      </div>
    </div>
    <div class="actions center"><button class="btn primary" data-action="submitEssay">Submit Essay</button></div>
  </div>`;
}

/* ---- transition between sections ---- */
function transitionHTML(){
  const s=curStage(); const P=app.P[s.id];
  let summary;
  if(s.layout==='essay') summary=`${countWords(P.essay||'')} words submitted`;
  else { const c=tally(P,s.count); summary=`Answered ${c.ans} of ${s.count}  ·  Marked for review ${c.rev}  ·  Unanswered ${c.skip+c.nv}`; }
  const remaining = curExam().stages.some(x=>!app.done.has(x.id));
  return `<div class="center-screen"><div class="result-card">
    <div class="check">✓</div>
    <h2>${s.layout==='essay'?'Analytical Writing':s.section+(s.sub?' · '+s.sub:'')} submitted</h2>
    <p>${summary}</p>
    <p style="font-size:13px;color:var(--dim);margin-top:6px">Submitted sections are locked. ${remaining?'Choose another section to continue.':'You have completed every section of this mock.'}</p>
    <div class="actions center"><button class="btn primary" data-action="proceed">${remaining?'Choose next section':'Finish test'}</button></div>
  </div></div>`;
}

/* ---- exam complete ---- */
function completeHTML(){
  const ex=curExam(); let answered=0, total=0, essayWords=null;
  ex.stages.forEach(s=>{
    if(s.layout==='essay') essayWords=countWords(app.P[s.id].essay||'');
    else { total+=s.count; answered+=tally(app.P[s.id],s.count).ans; }
  });
  if(app.mode==='diagnostic'){
    const d=app._diag||{percentile:0,answered,total};
    return `<div class="center-screen"><div class="result-card">
      <div class="badge-done">Diagnostic complete</div>
      <h2>${d.percentile}<span style="font-size:.5em;color:var(--dim)">ile</span></h2>
      <p>Predicted percentile from your diagnostic. You answered ${d.answered} of ${d.total} questions. This score is now saved to your dashboard.</p>
      <div class="actions center"><a class="btn primary" href="/dashboard">Back to dashboard →</a></div>
    </div></div>`;
  }
  const stats = `
    <div class="ms"><div class="n mono">${answered}/${total}</div><div class="k">Answered</div></div>
    <div class="ms"><div class="n mono">${ex.stages.filter(s=>s.layout!=='essay').length}</div><div class="k">Sections</div></div>
    ${essayWords!=null?`<div class="ms"><div class="n mono">${essayWords}</div><div class="k">Essay words</div></div>`:''}`;
  const analysisHref = app.mode==='sectional'
    ? `/mocks/${app.launchExam.toLowerCase()}/sectional/${app.sectionSlug}`
    : `/mocks/${app.launchExam.toLowerCase()}/full`;
  return `<div class="center-screen"><div class="result-card">
    <div class="badge-done">Mock complete</div>
    <h2>${ex.title} complete</h2>
    <p>You have attempted every section of this mock. Open your analysis to see your score, topic breakdown and question-by-question review.</p>
    <div class="mini-stats">${stats}</div>
    <div class="actions center">
      <a class="btn primary" href="${analysisHref}">View mock analysis →</a>
      <a class="btn ghost" href="/dashboard">Back to dashboard</a>
    </div>
  </div></div>`;
}

/* =========================================================
   EVENTS (delegated)
   ========================================================= */
const root = document.getElementById('app');
root.addEventListener('click', e=>{
  const a = e.target.closest('[data-action],[data-mode]'); if(!a) return;
  if(a.dataset.mode){ initExam(a.dataset.mode); return; }
  const act=a.dataset.action; const s=curStage(); const P=app.P[s.id];
  switch(act){
    case 'begin': if(app.mode==='sectional'){ startSection(0); } else { app.phase='select'; renderShell(); } break;
    case 'startSection': startSection(+a.dataset.stage); break;
    case 'opt':   P.ans[app.qIndex]=+a.dataset.i; renderStage(); break;
    case 'next':  leave(); if(app.qIndex<s.count-1) app.qIndex++; renderStage(); break;
    case 'prev':  leave(); if(app.qIndex>0) app.qIndex--; renderStage(); break;
    case 'jump':  leave(); app.qIndex=+a.dataset.q; renderStage(); break;
    case 'mark':  P.marked[app.qIndex]=true; leave(); if(app.qIndex<s.count-1) app.qIndex++; renderStage(); break;
    case 'clear': P.ans[app.qIndex]=null; renderStage(); break;
    case 'submitQ': if(P.ans[app.qIndex]==null) return; P.visited[app.qIndex]=true;
                    if(app.qIndex<s.count-1){ app.qIndex++; renderStage(); } else submitStage(); break;
    case 'submitStage': submitStage(); break;
    case 'submitEssay': submitStage(); break;
    case 'proceed': proceed(); break;
    case 'restart': initExam(app.examKey); break;
  }
});
root.addEventListener('input', e=>{
  const t=e.target.closest('[data-role="essay"]'); if(!t) return;
  app.P[curStage().id].essay = t.value;
  const wc=document.getElementById('wordcount'); if(wc) wc.textContent=countWords(t.value);
});

/* boot: launch from URL params */
(function(){
  const q = new URLSearchParams(location.search);
  const examP = (q.get('exam')||'cat').toUpperCase();
  const section = q.get('section');
  const diag = q.get('diagnostic')==='1' || q.get('diagnostic')==='true';
  const SECTION_MAP = {
    CAT:{varc:'varc',dilr:'dilr',qa:'qa'},
    GMAT:{quant:'gq',verbal:'gv',data:'gd'},
    GRE:{verbal:'gv1',quant:'gq1',awa:'essay'}
  };
  let launchKey = EXAMS[examP] ? examP : 'CAT';
  app.launchExam = launchKey;
  app.sectionSlug = section || null;
  app.mode = diag ? 'diagnostic' : (section ? 'sectional' : 'full');
  if(section && !diag){
    const map = SECTION_MAP[launchKey] || {};
    const stgId = map[section];
    const base = EXAMS[launchKey];
    const stage = (base && stgId) ? base.stages.find(s=>s.id===stgId) : null;
    if(stage){
      const idx = base.stages.indexOf(stage);
      const nm = stage.layout==='essay' ? 'Analytical Writing' : stage.section;
      EXAMS.__SEC = { title:`${nm} Mock Test 1`, progression:[base.progression[idx]||stage.section], stages:[Object.assign({},stage,{requires:undefined})] };
      launchKey='__SEC';
    } else { app.mode='full'; }
  }
  app.locked = (app.mode!=='full');
  initExam(launchKey);
  app.phase='instructions';
  renderShell();
})();
</script>
</body>
</html>
